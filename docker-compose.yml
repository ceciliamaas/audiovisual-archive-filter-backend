services:
  # Qdrant vector database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: archive_qdrant
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # gRPC API (optional)
    volumes:
      - ./qdrant_storage:/qdrant/storage:z
    environment:
      - QDRANT_ALLOW_RECOVERY_MODE=true
    restart: unless-stopped
    networks:
      - archive_network

  # Optional: Streamlit app (for local development)
  # Uncomment when you want to run the entire stack with Docker
  # app:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: archive_app
  #   ports:
  #     - "8501:8501"
  #   volumes:
  #     - .:/app
  #     - ./data:/app/data
  #   env_file:
  #     - .env
  #   depends_on:
  #     - qdrant
  #   environment:
  #     - QDRANT_URL=http://qdrant:6333
  #   command: streamlit run app.py
  #   restart: unless-stopped
  #   networks:
  #     - archive_network

networks:
  archive_network:
    driver: bridge

volumes:
  qdrant_storage:
