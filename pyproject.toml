[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.poetry]
package-mode = false

[project]
name = "audiovisual-archive-filter"
version = "1.0.0"
description = "AI-powered search for audiovisual archives using CLIP embeddings and YOLO object detection"
authors = [
    {name = "Cecilia", email = "cecilia@example.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.28.0",
    "numpy>=1.21.0",
    "pillow>=8.0.0",
    "replicate>=0.15.0",
    "python-dotenv>=0.19.0",
    "boto3>=1.26.0",
    "opencv-python>=4.5.0",
    "ultralytics>=8.0.0",
    "requests>=2.28.0",
    "tqdm>=4.65.0",
    "qdrant-client>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "isort>=5.0.0",
    "mypy>=0.991",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]

[project.urls]
Homepage = "https://github.com/ceciliamaas/audiovisual-archive-filter"
Repository = "https://github.com/ceciliamaas/audiovisual-archive-filter"
Issues = "https://github.com/ceciliamaas/audiovisual-archive-filter/issues"

[project.scripts]
archive-search = "src.web.app:main"

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=src --cov-report=html --cov-report=term-missing"